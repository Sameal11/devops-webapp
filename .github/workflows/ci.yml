name: React CI Pipeline with ChatOps

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm install

    - name: Build React App
      run: npm run build

    - name: Slack Success Notification
      if: success()
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{"text":"✅ CI Build Successful for React App"}' \
        ${{ secrets.SLACK_WEBHOOK }}

    - name: Slack Failure Notification
      if: failure()
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{"text":"❌ CI Build Failed for React App"}' \
        ${{ secrets.SLACK_WEBHOOK }}